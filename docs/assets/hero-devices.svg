<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="Smartphones, earbuds and a smartwatch">
  <defs>
    <radialGradient id="glow" cx="50%" cy="58%" r="50%">
      <stop offset="0" stop-color="#FF9C13" stop-opacity=".8"/>
      <stop offset=".45" stop-color="#FF6A00" stop-opacity=".28"/>
      <stop offset="1" stop-color="#FF6A00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0085FF" stop-opacity=".6"/>
      <stop offset="1" stop-color="#0085FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d8db0"/>
      <stop offset=".35" stop-color="#1a2338"/>
      <stop offset=".7" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#8e9cb8"/>
    </linearGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b5cff"/>
      <stop offset=".55" stop-color="#7b3cff"/>
      <stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00c2ff"/>
      <stop offset="1" stop-color="#0035b8"/>
    </linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset=".6" stop-color="#ff5f2e"/>
      <stop offset="1" stop-color="#b3125e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c3cddd"/>
    </linearGradient>
  </defs>

  <ellipse cx="330" cy="300" rx="310" ry="230" fill="url(#glow)"/>
  <ellipse cx="190" cy="190" rx="210" ry="180" fill="url(#glowB)"/>

  <!-- glowing platform -->
  <ellipse cx="330" cy="472" rx="270" ry="28" fill="#FF9C13" opacity=".22"/>
  <ellipse cx="330" cy="472" rx="200" ry="14" fill="#ffd08a" opacity=".35"/>

  <!-- back-left phone -->
  <g transform="rotate(-14 210 260)">
    <rect x="140" y="90" width="150" height="310" rx="28" fill="url(#frame)"/>
    <rect x="148" y="98" width="134" height="294" rx="22" fill="url(#s2)"/>
    <rect x="196" y="107" width="38" height="10" rx="5" fill="#050914"/>
    <circle cx="215" cy="250" r="46" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="10"/>
    <rect x="148" y="98" width="134" height="294" rx="22" fill="url(#shine)"/>
  </g>

  <!-- back-right phone (rear camera view) -->
  <g transform="rotate(12 450 270)">
    <rect x="380" y="100" width="150" height="310" rx="28" fill="url(#frame)"/>
    <rect x="388" y="108" width="134" height="294" rx="22" fill="url(#s3)"/>
    <rect x="398" y="120" width="64" height="64" rx="18" fill="#0b1220" opacity=".88"/>
    <circle cx="416" cy="138" r="10" fill="#1d2a44" stroke="#6b7b98" stroke-width="2.5"/>
    <circle cx="444" cy="138" r="10" fill="#1d2a44" stroke="#6b7b98" stroke-width="2.5"/>
    <circle cx="416" cy="166" r="10" fill="#1d2a44" stroke="#6b7b98" stroke-width="2.5"/>
    <circle cx="444" cy="166" r="4" fill="#ffd27a"/>
    <rect x="388" y="108" width="134" height="294" rx="22" fill="url(#shine)"/>
  </g>

  <!-- center phone -->
  <g>
    <rect x="252" y="56" width="166" height="348" rx="32" fill="url(#frame)"/>
    <rect x="260" y="64" width="150" height="332" rx="25" fill="url(#s1)"/>
    <rect x="312" y="75" width="46" height="13" rx="6.5" fill="#050914"/>
    <text x="335" y="148" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#fff" text-anchor="middle">9:41</text>
    <text x="335" y="170" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#fff" fill-opacity=".8" text-anchor="middle">Buenavista, Bohol</text>
    <g fill="#fff" fill-opacity=".22">
      <rect x="276" y="300" width="26" height="26" rx="8"/>
      <rect x="312" y="300" width="26" height="26" rx="8"/>
      <rect x="348" y="300" width="26" height="26" rx="8"/>
      <rect x="276" y="340" width="26" height="26" rx="8"/>
      <rect x="312" y="340" width="26" height="26" rx="8"/>
      <rect x="348" y="340" width="26" height="26" rx="8"/>
    </g>
    <rect x="260" y="64" width="150" height="332" rx="25" fill="url(#shine)"/>
  </g>

  <!-- earbuds case -->
  <g transform="translate(150 362)">
    <ellipse cx="34" cy="14" rx="13" ry="17" fill="#f4f7fb"/>
    <rect x="29" y="22" width="9" height="26" rx="4.5" fill="#e3e9f2"/>
    <ellipse cx="76" cy="14" rx="13" ry="17" fill="#f4f7fb"/>
    <rect x="71" y="22" width="9" height="26" rx="4.5" fill="#e3e9f2"/>
    <rect x="0" y="38" width="110" height="78" rx="32" fill="url(#case)"/>
    <path d="M4 62h102" stroke="#9aa6ba" stroke-width="2"/>
    <circle cx="55" cy="84" r="4" fill="#25D366"/>
  </g>

  <!-- smartwatch -->
  <g transform="translate(468 356)">
    <rect x="22" y="-28" width="56" height="36" rx="10" fill="#1b2438"/>
    <rect x="22" y="110" width="56" height="36" rx="10" fill="#1b2438"/>
    <rect x="0" y="0" width="100" height="118" rx="28" fill="url(#frame)"/>
    <rect x="8" y="8" width="84" height="102" rx="22" fill="#050914"/>
    <circle cx="50" cy="59" r="30" fill="none" stroke="#FF9C13" stroke-width="6" stroke-dasharray="140 60" stroke-linecap="round"/>
    <circle cx="50" cy="59" r="19" fill="none" stroke="#0085FF" stroke-width="6" stroke-dasharray="85 40" stroke-linecap="round"/>
  </g>
</svg>
